<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Elite - Interactive Tools</title>
    <meta name="description" content="Sam Elite learning portal featuring interactive simulations and logic tools." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <style>
      body {
        margin: 0;
        background-color: #090b10;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090b10; color: #a1a1aa;">
        <div style="width: 44px; height: 44px; border: 3px solid #27272a; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Redirecting to Sam Elite...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      var path = window.location.pathname;
      var repoBase = path.split('/')[1];
      if (repoBase && !path.endsWith('/')) {
        window.location.replace('/' + repoBase + '/');
      } else {
        window.location.replace('./');
      }
    </script>
  </body>
</html>
