<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Pixel Wings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      border: 2px solid #0284c7;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
      border-radius: 8px;
      overflow: hidden;
      width: 360px;
      height: 520px;
    }
    canvas {
      display: block;
      background: #082f49;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 800;
      background: #0ea5e9;
      color: #030712;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.6);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="360" height="520"></canvas>
    <div id="startOverlay" class="overlay">
      <h1 style="font-size:30px; font-weight:900; color:#38bdf8; margin-bottom:8px;">FLAPPY WINGS</h1>
      <p style="color:#94a3b8; font-size:14px; text-align:center; max-width:240px;">Press <b>Spacebar</b> or tap screen to flap wings and glide through pipes!</p>
      <button id="startBtn" class="btn">FLAP AWAY</button>
    </div>
    <div id="deadOverlay" class="overlay hidden">
      <h2 style="font-size:32px; color:#ef4444; margin-bottom:6px;">GAME OVER</h2>
      <p style="font-size:18px;">Score: <b id="finalScore" style="color:#38bdf8;">0</b></p>
      <p style="font-size:14px; color:#94a3b8;">Best: <b id="finalBest">0</b></p>
      <button id="restartBtn" class="btn">TRY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const deadOverlay = document.getElementById('deadOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');

    let audioCtx = null;
    function beep(freq, dur=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let bird = { x: 70, y: 240, vy: 0, radius: 14 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let isRunning = false;
    let frame = 0;

    const GRAVITY = 0.35;
    const JUMP = -6.2;
    const GAP = 120;
    const PIPE_WIDTH = 52;
    const PIPE_SPEED = 2.2;

    function reset() {
      bird = { x: 70, y: 240, vy: 0, radius: 14 };
      pipes = [];
      score = 0;
      frame = 0;
      isRunning = true;
      startOverlay.classList.add('hidden');
      deadOverlay.classList.add('hidden');
      beep(500, 0.1);
    }

    function flap() {
      if (!isRunning) return;
      bird.vy = JUMP;
      beep(700, 0.05);
    }

    function die() {
      isRunning = false;
      beep(150, 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
      }
      finalScoreEl.textContent = score;
      finalBestEl.textContent = best;
      deadOverlay.classList.remove('hidden');
    }

    function update() {
      if (!isRunning) return;

      frame++;
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      // Floor / Ceiling check
      if (bird.y + bird.radius > canvas.height - 30 || bird.y - bird.radius < 0) {
        die();
        return;
      }

      // Add pipes
      if (frame % 95 === 0) {
        const topH = Math.floor(Math.random() * (canvas.height - GAP - 140)) + 40;
        pipes.push({
          x: canvas.width,
          top: topH,
          bottom: topH + GAP,
          passed: false
        });
      }

      // Move pipes
      for (let i = 0; i < pipes.length; i++) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Collision check
        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
            die();
            return;
          }
        }

        // Score
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          beep(900, 0.1);
        }
      }

      pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
    }

    function draw() {
      ctx.fillStyle = '#082f49';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars/particles in background
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      for (let i = 0; i < 20; i++) {
        const sx = ((i * 47) - (frame * 0.5)) % canvas.width;
        const xPos = sx < 0 ? sx + canvas.width : sx;
        ctx.fillRect(xPos, (i * 31) % (canvas.height - 40), 2, 2);
      }

      // Draw Pipes
      pipes.forEach(p => {
        // Top Pipe
        const gTop = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
        gTop.addColorStop(0, '#10b981');
        gTop.addColorStop(0.7, '#34d399');
        gTop.addColorStop(1, '#059669');
        ctx.fillStyle = gTop;
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);

        // Bottom Pipe
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom);
        ctx.fillRect(p.x - 3, p.bottom, PIPE_WIDTH + 6, 16);
      });

      // Ground
      ctx.fillStyle = '#065f46';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
      ctx.fillStyle = '#34d399';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 4);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08)));

      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(19, 3);
      ctx.lineTo(12, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Live Score on screen
      if (isRunning) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(score, canvas.width / 2, 60);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!isRunning && !deadOverlay.classList.contains('hidden')) {
          reset();
        } else if (!isRunning && !startOverlay.classList.contains('hidden')) {
          reset();
        } else {
          flap();
        }
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!isRunning) return;
      flap();
    });

    document.getElementById('startBtn').addEventListener('click', reset);
    document.getElementById('restartBtn').addEventListener('click', reset);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
