<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Pong AI & 2-Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f3f4f6;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
      border-radius: 8px;
      overflow: hidden;
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 800;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 6px;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="560" height="380"></canvas>
    <div id="menuOverlay" class="overlay">
      <h1 style="font-size:32px; color:#60a5fa; margin-bottom:12px;">RETRO PONG</h1>
      <p style="color:#94a3b8; margin-bottom:16px;">P1: W/S Keys &bull; P2: Up/Down Arrows</p>
      <div>
        <button id="mode1P" class="btn">1 PLAYER VS AI</button>
        <button id="mode2P" class="btn" style="background:#8b5cf6;">2 PLAYER LOCAL</button>
      </div>
    </div>
    <div id="winOverlay" class="overlay hidden">
      <h2 id="winMsg" style="font-size:30px; color:#60a5fa; margin-bottom:12px;">PLAYER 1 WINS!</h2>
      <button id="rematchBtn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menuOverlay');
    const winOverlay = document.getElementById('winOverlay');
    const winMsg = document.getElementById('winMsg');

    let audioCtx = null;
    function beep(f, dur=0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isPlaying = false;
    let is2P = false;
    let p1Score = 0;
    let p2Score = 0;
    const WIN_SCORE = 7;

    const PADDLE_W = 12;
    const PADDLE_H = 70;
    let p1 = { x: 20, y: 155, vy: 6 };
    let p2 = { x: 528, y: 155, vy: 6 };
    let ball = { x: 280, y: 190, r: 6, vx: 5, vy: 2 };
    let keys = {};

    function start(twoPlayer) {
      is2P = twoPlayer;
      p1Score = 0;
      p2Score = 0;
      p1.y = 155;
      p2.y = 155;
      resetBall(1);
      isPlaying = true;
      menuOverlay.classList.add('hidden');
      winOverlay.classList.add('hidden');
    }

    function resetBall(servingTo) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.8 - 0.4);
      const speed = 5.5;
      ball.vx = (servingTo === 1 ? -1 : 1) * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function update() {
      if (!isPlaying) return;

      // P1 movement (W / S)
      if (keys['w'] || keys['W']) p1.y = Math.max(10, p1.y - p1.vy);
      if (keys['s'] || keys['S']) p1.y = Math.min(canvas.height - PADDLE_H - 10, p1.y + p1.vy);

      // P2 movement (2P arrows OR AI)
      if (is2P) {
        if (keys['ArrowUp']) p2.y = Math.max(10, p2.y - p2.vy);
        if (keys['ArrowDown']) p2.y = Math.min(canvas.height - PADDLE_H - 10, p2.y + p2.vy);
      } else {
        // AI logic
        const targetY = ball.y - PADDLE_H / 2;
        if (p2.y + PADDLE_H / 2 < ball.y - 10) p2.y += 4.2;
        else if (p2.y + PADDLE_H / 2 > ball.y + 10) p2.y -= 4.2;
        p2.y = Math.max(10, Math.min(canvas.height - PADDLE_H - 10, p2.y));
      }

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top & Bottom bounce
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = -ball.vy; beep(300); }
      if (ball.y + ball.r >= canvas.height) { ball.y = canvas.height - ball.r; ball.vy = -ball.vy; beep(300); }

      // P1 Collision
      if (ball.x - ball.r <= p1.x + PADDLE_W && ball.x + ball.r >= p1.x &&
          ball.y >= p1.y && ball.y <= p1.y + PADDLE_H && ball.vx < 0) {
        const delta = (ball.y - (p1.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy = delta * 5.5;
        beep(500);
      }

      // P2 Collision
      if (ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + PADDLE_W &&
          ball.y >= p2.y && ball.y <= p2.y + PADDLE_H && ball.vx > 0) {
        const delta = (ball.y - (p2.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = delta * 5.5;
        beep(500);
      }

      // Scoring
      if (ball.x < 0) {
        p2Score++;
        beep(200, 0.2);
        if (p2Score >= WIN_SCORE) return gameOver(is2P ? 'PLAYER 2' : 'COMPUTER');
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1Score++;
        beep(700, 0.2);
        if (p1Score >= WIN_SCORE) return gameOver('PLAYER 1');
        resetBall(2);
      }
    }

    function gameOver(winner) {
      isPlaying = false;
      winMsg.textContent = `${winner} WINS!`;
      winOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.fillStyle = '#f3f4f6';
      ctx.font = 'bold 44px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p1Score, canvas.width / 4, 60);
      ctx.fillText(p2Score, (canvas.width / 4) * 3, 60);

      // Paddles
      ctx.fillStyle = '#3b82f6';
      ctx.shadowColor = '#60a5fa';
      ctx.shadowBlur = 10;
      ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);

      ctx.fillStyle = is2P ? '#a855f7' : '#ec4899';
      ctx.shadowColor = is2P ? '#c084fc' : '#f472b6';
      ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    document.getElementById('mode1P').addEventListener('click', () => start(false));
    document.getElementById('mode2P').addEventListener('click', () => start(true));
    document.getElementById('rematchBtn').addEventListener('click', () => menuOverlay.classList.remove('hidden'));

    requestAnimationFrame(loop);
  </script>
</body>
</html>
