<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T-Rex Chrome Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #111827;
      color: #f3f4f6;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      border: 2px solid #f97316;
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
      border-radius: 8px;
      overflow: hidden;
      background: #1f2937;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 800;
      background: #f97316;
      color: #111827;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.5);
    }
    .m-btns {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 768px) {
      .m-btns { display: none; }
    }
    .m-btn {
      padding: 12px 30px;
      background: #374151;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #4b5563;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="600" height="250"></canvas>
    <div id="startOverlay" class="overlay">
      <h1 style="font-size:26px; color:#fb923c; margin-bottom:8px;">T-REX RUNNER</h1>
      <p style="color:#9ca3af; font-size:14px; text-align:center;">Press <b>Space / Up</b> to Jump.<br>Press <b>Down Arrow</b> to Duck.</p>
      <button id="startBtn" class="btn">RUN</button>
    </div>
    <div id="deadOverlay" class="overlay hidden">
      <h2 style="font-size:28px; color:#ef4444; margin-bottom:6px;">GAME OVER</h2>
      <p>Score: <b id="finalScore" style="color:#fb923c;">0</b></p>
      <button id="restartBtn" class="btn">RETRY</button>
    </div>
  </div>

  <div class="m-btns">
    <button class="m-btn" id="t-duck">DUCK ▼</button>
    <button class="m-btn" id="t-jump" style="background:#f97316; color:#000;">JUMP ▲</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const deadOverlay = document.getElementById('deadOverlay');
    const finalScoreEl = document.getElementById('finalScore');

    let audioCtx = null;
    function beep(f, dur=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isPlaying = false;
    let score = 0;
    let best = parseInt(localStorage.getItem('dino_best') || '0', 10);
    let speed = 6;
    let frame = 0;

    let dino = {
      x: 50,
      y: 190,
      w: 30,
      h: 40,
      vy: 0,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let clouds = [
      { x: 100, y: 40, s: 1 },
      { x: 340, y: 60, s: 1.2 },
      { x: 500, y: 30, s: 0.8 }
    ];

    function reset() {
      score = 0;
      speed = 6;
      frame = 0;
      obstacles = [];
      dino.y = 190;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      dino.h = 40;
      isPlaying = true;
      startOverlay.classList.add('hidden');
      deadOverlay.classList.add('hidden');
      beep(440, 0.1);
    }

    function jump() {
      if (!isPlaying) return;
      if (dino.isGrounded) {
        dino.vy = -11.5;
        dino.isGrounded = false;
        beep(600, 0.05);
      }
    }

    function duck(isDown) {
      if (!isPlaying) return;
      dino.isDucking = isDown;
      if (isDown) {
        dino.h = 24;
        if (!dino.isGrounded) dino.vy += 6; // fast drop
      } else {
        dino.h = 40;
      }
    }

    function update() {
      if (!isPlaying) return;
      frame++;
      score += 0.15;
      speed += 0.001;

      // Gravity
      dino.vy += 0.65;
      dino.y += dino.vy;

      const groundY = 230 - dino.h;
      if (dino.y >= groundY) {
        dino.y = groundY;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.s;
        if (c.x < -60) c.x = 650;
      });

      // Spawn obstacles
      if (frame % Math.floor(Math.max(45, 90 - speed * 2)) === 0) {
        const isBird = score > 150 && Math.random() < 0.35;
        if (isBird) {
          obstacles.push({
            x: 620,
            y: 165,
            w: 32,
            h: 22,
            isBird: true
          });
        } else {
          const count = Math.random() < 0.4 ? 2 : 1;
          obstacles.push({
            x: 620,
            y: 230 - 36,
            w: count * 16,
            h: 36,
            isBird: false
          });
        }
      }

      // Move obstacles & detect collision
      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= speed;

        // Collision bounding box
        if (dino.x < o.x + o.w && dino.x + dino.w > o.x && dino.y < o.y + o.h && dino.y + dino.h > o.y) {
          die();
          return;
        }
      }

      obstacles = obstacles.filter(o => o.x > -50);
    }

    function die() {
      isPlaying = false;
      beep(150, 0.3);
      if (score > best) {
        best = Math.floor(score);
        localStorage.setItem('dino_best', best);
      }
      finalScoreEl.textContent = Math.floor(score);
      deadOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#4b5563';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 12, c.y - 6, 12, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 230);
      ctx.lineTo(canvas.width, 230);
      ctx.stroke();

      // Little ground pebbles
      ctx.fillStyle = '#6b7280';
      for (let i = 0; i < 15; i++) {
        const px = ((i * 45) - (frame * speed * 0.5)) % canvas.width;
        const finalPx = px < 0 ? px + canvas.width : px;
        ctx.fillRect(finalPx, 234, 4, 2);
      }

      // Dino
      ctx.fillStyle = '#fb923c';
      if (dino.isDucking) {
        ctx.fillRect(dino.x, dino.y, dino.w + 10, dino.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(dino.x + dino.w + 2, dino.y + 4, 3, 3); // eye
      } else {
        ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
        // Head
        ctx.fillRect(dino.x + 12, dino.y - 6, 20, 14);
        ctx.fillStyle = '#fff';
        ctx.fillRect(dino.x + 26, dino.y - 2, 3, 3); // eye
      }

      // Obstacles
      obstacles.forEach(o => {
        if (o.isBird) {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + 10);
          ctx.lineTo(o.x + 16, o.y);
          ctx.lineTo(o.x + 32, o.y + 10);
          ctx.lineTo(o.x + 16, o.y + 20);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillRect(o.x - 4, o.y + 8, o.w + 8, 6);
        }
      });

      // HUD
      ctx.fillStyle = '#f3f4f6';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`HI ${Math.floor(best).toString().padStart(5, '0')}  ${Math.floor(score).toString().padStart(5, '0')}`, 580, 28);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        jump();
      } else if (e.key === 'ArrowDown') {
        duck(true);
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowDown') {
        duck(false);
      }
    });

    document.getElementById('startBtn').addEventListener('click', reset);
    document.getElementById('restartBtn').addEventListener('click', reset);

    document.getElementById('t-jump').addEventListener('click', jump);
    document.getElementById('t-duck').addEventListener('touchstart', () => duck(true));
    document.getElementById('t-duck').addEventListener('touchend', () => duck(false));

    requestAnimationFrame(loop);
  </script>
</body>
</html>
