<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Sweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .panel {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 14px;
    }
    .digits {
      font-family: monospace;
      font-size: 26px;
      font-weight: 800;
      color: #e11d48;
      background: #000;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: 2px;
    }
    .smiley-btn {
      font-size: 24px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .smiley-btn:active { transform: scale(0.92); }
    .diff-select {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
    }
    .diff-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #e11d48;
      color: #fff;
      border-color: #f43f5e;
    }
    .grid-container {
      overflow: auto;
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .grid {
      display: grid;
      gap: 1px;
      background: #334155;
    }
    .cell {
      width: 30px;
      height: 30px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover { background: #334155; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #e11d48; }
    .c1 { color: #38bdf8; }
    .c2 { color: #4ade80; }
    .c3 { color: #f87171; }
    .c4 { color: #c084fc; }
    .c5 { color: #fb923c; }
    .c6 { color: #2dd4bf; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="diff-select">
      <button class="diff-btn active" data-diff="easy">Beginner (9x9)</button>
      <button class="diff-btn" data-diff="med">Medium (16x16)</button>
      <button class="diff-btn" data-diff="hard">Expert (24x16)</button>
    </div>

    <div class="top-bar">
      <div class="digits" id="minesLeft">010</div>
      <button class="smiley-btn" id="face">🙂</button>
      <div class="digits" id="timer">000</div>
    </div>

    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const minesLeftEl = document.getElementById('minesLeft');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');
    const diffBtns = document.querySelectorAll('.diff-btn');

    const CONFIGS = {
      easy: { r: 9, c: 9, m: 10 },
      med: { r: 16, c: 16, m: 40 },
      hard: { r: 16, c: 24, m: 60 }
    };

    let curDiff = 'easy';
    let rows = 9, cols = 9, totalMines = 10;
    let board = [];
    let state = 'idle'; // 'idle', 'playing', 'won', 'lost'
    let timer = 0;
    let timerInterval = null;
    let flagsPlaced = 0;

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '000';
      state = 'idle';
      faceEl.textContent = '🙂';
      flagsPlaced = 0;
      minesLeftEl.textContent = String(totalMines).padStart(3, '0');

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
      board = [];

      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push({
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0
          });
        }
        board.push(row);
      }

      render();
    }

    function plantMines(firstR, firstC) {
      let planted = 0;
      while (planted < totalMines) {
        let r = Math.floor(Math.random() * rows);
        let c = Math.floor(Math.random() * cols);
        if (!board[r][c].isMine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
          board[r][c].isMine = true;
          planted++;
        }
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].isMine) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) cnt++;
              }
            }
            board[r][c].count = cnt;
          }
        }
      }
    }

    function reveal(r, c) {
      if (state === 'lost' || state === 'won') return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      if (state === 'idle') {
        state = 'playing';
        plantMines(r, c);
        timerInterval = setInterval(() => {
          timer = Math.min(999, timer + 1);
          timerEl.textContent = String(timer).padStart(3, '0');
        }, 1000);
      }

      cell.revealed = true;

      if (cell.isMine) {
        gameOver(false);
        return;
      }

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !board[nr][nc].revealed) {
              reveal(nr, nc);
            }
          }
        }
      }

      checkWin();
      render();
    }

    function toggleFlag(r, c) {
      if (state === 'lost' || state === 'won') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flagsPlaced += cell.flagged ? 1 : -1;
      minesLeftEl.textContent = String(Math.max(0, totalMines - flagsPlaced)).padStart(3, '0');
      render();
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      clearInterval(timerInterval);
      state = won ? 'won' : 'lost';
      faceEl.textContent = won ? '😎' : '😵';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].isMine) {
            board[r][c].revealed = true;
          }
        }
      }
      render();
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const item = board[r][c];
          const d = document.createElement('div');
          d.className = 'cell';

          if (item.revealed) {
            d.classList.add('revealed');
            if (item.isMine) {
              d.classList.add('mine');
              d.textContent = '💣';
            } else if (item.count > 0) {
              d.classList.add(`c${item.count}`);
              d.textContent = item.count;
            }
          } else if (item.flagged) {
            d.textContent = '🚩';
          }

          d.addEventListener('click', () => reveal(r, c));
          d.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          gridEl.appendChild(d);
        }
      }
    }

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curDiff = btn.dataset.diff;
        rows = CONFIGS[curDiff].r;
        cols = CONFIGS[curDiff].c;
        totalMines = CONFIGS[curDiff].m;
        initGame();
      });
    });

    faceEl.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
