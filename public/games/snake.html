<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake Neon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060913;
      color: #10b981;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .hud span { color: #fff; }
    #canvas-wrap {
      position: relative;
      border: 2px solid #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
      border-radius: 8px;
      background: #020617;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 800;
      background: #10b981;
      color: #020617;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }
    .touch-pad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 8px;
      margin-top: 14px;
    }
    @media (min-width: 768px) {
      .touch-pad { display: none; }
    }
    .t-btn {
      width: 50px;
      height: 50px;
      background: #1e293b;
      color: #10b981;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
    <div>SPEED: <span id="speed">1x</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="startOverlay" class="overlay">
      <h1 style="font-size:28px; margin-bottom: 8px; color:#10b981;">CYBER SNAKE</h1>
      <p style="color:#94a3b8; font-size:14px; text-align:center; max-width:280px;">Use Arrow keys or WASD to control. Hold Shift or Space to boost speed!</p>
      <button id="startBtn" class="btn">PRESS START</button>
    </div>
    <div id="deadOverlay" class="overlay hidden">
      <h2 style="font-size:32px; color:#ef4444; margin-bottom:8px;">GAME OVER</h2>
      <p style="color:#f8fafc;">Final Score: <b id="finalScore">0</b></p>
      <button id="restartBtn" class="btn">RETRY</button>
    </div>
  </div>

  <div class="touch-pad">
    <div></div>
    <div class="t-btn" id="t-up">▲</div>
    <div></div>
    <div class="t-btn" id="t-left">◀</div>
    <div class="t-btn" id="t-down">▼</div>
    <div class="t-btn" id="t-right">▶</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const startOverlay = document.getElementById('startOverlay');
    const deadOverlay = document.getElementById('deadOverlay');
    const finalScoreEl = document.getElementById('finalScore');

    let audioCtx = null;
    function beep(f, t='sine', d=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + d);
      } catch (e) {}
    }

    const GRID = 20;
    const TILES = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 15, type: 'normal' };
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let isRunning = false;
    let boost = false;
    let gameLoop = null;

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
      deadOverlay.classList.add('hidden');
      startOverlay.classList.add('hidden');
      isRunning = true;
      clearInterval(gameLoop);
      runLoop();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILES);
        food.y = Math.floor(Math.random() * TILES);
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
      food.type = Math.random() < 0.2 ? 'golden' : 'normal';
    }

    function step() {
      if (!isRunning) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        return die();
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return die();
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        const pts = food.type === 'golden' ? 30 : 10;
        score += pts;
        scoreEl.textContent = score;
        beep(food.type === 'golden' ? 880 : 520, 'triangle', 0.12);
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_best', best);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function die() {
      isRunning = false;
      beep(150, 'sawtooth', 0.4);
      clearInterval(gameLoop);
      finalScoreEl.textContent = score;
      deadOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle cyber grid
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.07)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.save();
      if (food.type === 'golden') {
        ctx.fillStyle = '#eab308';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 15;
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
      }
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Snake
      snake.forEach((s, idx) => {
        ctx.save();
        if (idx === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = '#059669';
        }
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
        ctx.restore();
      });
    }

    function runLoop() {
      const ms = boost ? 50 : Math.max(65, 110 - Math.floor(score / 50) * 5);
      speedEl.textContent = boost ? '2x ⚡' : `${(110 / ms).toFixed(1)}x`;
      clearInterval(gameLoop);
      gameLoop = setInterval(step, ms);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'w', 'W'].includes(e.key) && dir.y !== 1) nextDir = { x: 0, y: -1 };
      if (['ArrowDown', 's', 'S'].includes(e.key) && dir.y !== -1) nextDir = { x: 0, y: 1 };
      if (['ArrowLeft', 'a', 'A'].includes(e.key) && dir.x !== 1) nextDir = { x: -1, y: 0 };
      if (['ArrowRight', 'd', 'D'].includes(e.key) && dir.x !== -1) nextDir = { x: 1, y: 0 };
      if (e.key === ' ' || e.key === 'Shift') {
        boost = true;
        if (isRunning) runLoop();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === ' ' || e.key === 'Shift') {
        boost = false;
        if (isRunning) runLoop();
      }
    });

    document.getElementById('startBtn').addEventListener('click', reset);
    document.getElementById('restartBtn').addEventListener('click', reset);

    document.getElementById('t-up').addEventListener('click', () => { if (dir.y !== 1) nextDir = { x: 0, y: -1 }; });
    document.getElementById('t-down').addEventListener('click', () => { if (dir.y !== -1) nextDir = { x: 0, y: 1 }; });
    document.getElementById('t-left').addEventListener('click', () => { if (dir.x !== 1) nextDir = { x: -1, y: 0 }; });
    document.getElementById('t-right').addEventListener('click', () => { if (dir.x !== -1) nextDir = { x: 1, y: 0 }; });

    draw();
  </script>
</body>
</html>
